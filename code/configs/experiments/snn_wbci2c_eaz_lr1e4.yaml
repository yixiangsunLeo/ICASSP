experiment:
  name: "foundation_cross_subject"
  source_config: "configs/experiments/snn_wbci2c_eaz_lr1e4.yaml"

# =====================================================================
# SPIKING EEGNeX ROUND (ICASSP 2027) — wbci2c x eaz x lr1e4
# Plan: docs/PLAN_spiking_eegnex_icassp2027.md ; generated by scripts/make_snn_configs.py
#
# WBCIC-SHU 2C (51 subjects, 58 ch). 30/31:10:10/11 by subject ~ 6:2:2. The only cohort powered to detect ~2pp paired differences.
#
# NORMALIZATION: per-SESSION Euclidean Alignment then the benchmark's per-trial channel z-score (empirical arm)
# LR: 0.0001  (benchmark recipe value)
# PAIRING: cross_subject block identical to the 18-entry benchmark -> same folds, same
#   test subjects; every entry here is paired per subject with those 18 ANN entries.
# ADABN: evaluation-time only; adds adabn_* columns (BatchNorm stats re-estimated on each
#   held-out subject's unlabeled trials). Does not touch training or the cell signature.
# =====================================================================

run_id: "snn_wbci2c_eaz_lr1e4_v1"

data:
  name: "wbci_shu_2c"
  manifest: "processed_manifest"
  status_filter: ["ok"]
  n_channels: 58
  n_times: 1000
  n_classes: 2
  sfreq: 250

models: ["eegnex", "eegnet_official", "seegnex@hplif", "seegnex@s_lif", "seegnex@s_plif", "seegnex@s_hplif", "seegnet@plif"]

cross_subject:
  protocol: "kfold_subject"
  n_folds: 5
  val_mode: "subjects"
  n_val_subjects: 10
  split_seeds: [41, 42]

train:
  optimizer: "adam"
  lr: 0.0001
  batch_size: 128
  max_epochs: 500                 # ceiling only; patience binds first
  weight_decay: 0.0
  scheduler: "none"
  grad_clip_norm: 0.0
  monitor: "macro_f1"
  monitor_mode: "max"
  early_stopping_patience: 25
  normalization: "ea_session+per_sample_zscore"
  num_workers: 2
  amp: false
  device: "cuda"
  seeds: [0]
  # curves off: (i) no per-epoch test accuracy is printed while humans watch the pilot
  # (statistics review, model-selection audit), (ii) each extra eval pass re-runs the
  # 1000-step neuron loops. Re-enable for the H4 (overfitting) observation if wanted.
  curves: false
  train_eval_max_trials: 2000
  # T=4 direct encoding stores ~4x the ANN activations; keep the effective batch at 128.
  micro_batch_per_model:
    "seegnex@hplif": 64
    "seegnex@plif": 64
    "seegnex@lif": 64
    "seegnex@plif_t8": 32
    "seegnet@plif": 64

model_params: {}

eval:
  metrics: ["accuracy", "macro_f1", "auc", "balanced_accuracy", "cohen_kappa"]
  calibration_metrics: ["nll", "brier", "ece"]
  report_scope: "per_test_subject"
  adabn: true

checkpoints:
  keep: ["best", "last"]
  resume: true

output:
  output_dir: "outputs/experiments/wbci_shu/snn_wbci2c_eaz_lr1e4_v1"
  checkpoint_dir: "checkpoints/wbci_shu/snn_wbci2c_eaz_lr1e4_v1"
